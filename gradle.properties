#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
kotlin.caching.enabled=true
kotlin.incremental=true
# No fallar en hosts sin toolchain de Apple: JitPack compila en Linux y sí puede
# generar los klibs de iOS, pero no enlazar frameworks.
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Workaround AGP 9.0+: com.android.library es incompatible con kotlin.multiplatform
# si se dejan activos el Kotlin integrado de AGP y el DSL nuevo. Mismos flags que
# CrashlyticsKMP, que es la librería del autor ya publicada con AGP 9.
android.builtInKotlin=false
android.newDsl=false
