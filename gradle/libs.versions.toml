[versions]
agp = "9.2.1"
# 36 a propósito, igual que CrashlyticsKMP: compileSdk fija el minCompileSdk del AAR, el suelo
# que se le impone a quien consuma la librería. Con 37 quedarían fuera los proyectos con AGP 8.x,
# cuyo máximo es 36. Por eso la 1.0.1 falló en JitPack: lifecycle-runtime-compose 2.11 exigía 37,
# y ni siquiera se usaba. Antes de añadir una dependencia androidx, mirar qué compileSdk pide.
android-compileSdk = "36"
android-minSdk = "24"
composeMultiplatform = "1.11.1"
kotlin = "2.4.10"
kotlinxCoroutines = "1.10.2"

#AdMob
playServicesAds = "25.4.0"


[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

#AdMob
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }


[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
